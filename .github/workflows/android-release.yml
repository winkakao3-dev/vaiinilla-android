name: Android Release Readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # This is a Repository Variable, not a secret. The workflow refuses to
      # build if it is absent so production never falls back to localhost.
      VAIINILLA_API_BASE_URL: ${{ vars.VAIINILLA_API_BASE_URL || 'https://vaiinillaback.up.railway.app/api/v1/' }}
      VAIINILLA_VERSION_NAME: ${{ vars.VAIINILLA_VERSION_NAME || '0.5.0' }}
      VAIINILLA_VERSION_CODE: ${{ vars.VAIINILLA_VERSION_CODE || '16' }}
      # Signing stays optional until the definitive production key exists.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VAIINILLA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VAIINILLA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      VAIINILLA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Require release endpoint configuration
        if: env.VAIINILLA_API_BASE_URL == ''
        run: |
          echo "Set the VAIINILLA_API_BASE_URL repository variable before running release CI." >&2
          exit 1

      - name: Prepare optional release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vaiinilla-release.keystore"
          echo "VAIINILLA_RELEASE_STORE_FILE=$RUNNER_TEMP/vaiinilla-release.keystore" >> "$GITHUB_ENV"

      - name: Validate contractual fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Audit release scope
        run: ./scripts/audit_release_scope.sh

      - name: App/backend regression gate
        run: ./scripts/check_app_backend_contract.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testProdDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintProdRelease

      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Release bundle (Prod)
        run: ./gradlew --no-daemon bundleProdRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaiinilla-prod-release-aab
          path: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
