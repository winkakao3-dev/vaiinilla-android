name: Android Instrumented Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  connected-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Pull-request checks must use the current Development API explicitly;
      # this prevents a stale repository variable from routing CI to a retired
      # Railway hostname. Main still uses the configured production endpoint.
      VAIINILLA_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://vaiinillaback-development.up.railway.app/api/v1/' || vars.VAIINILLA_API_BASE_URL || 'https://vaiinillaback.up.railway.app/api/v1/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pin this to a specific commit SHA (not just the version tag) before relying on
      # it in a real release gate, following the same convention as the other actions
      # pinned above. Left as a version tag here because it could not be verified from
      # this session.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            ./gradlew --no-daemon
            connectedDevAlumnoDebugAndroidTest
            connectedDevCajaDebugAndroidTest
            connectedDevCocinaDebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connected-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn
