name: QA Express APKs

# Manual-only remote builder: compiles the three dev APKs and leaves them as a
# downloadable artifact, without tests/lint and WITHOUT Firebase App
# Distribution (distribution is 100% local now — builds happen on the Mac and
# install via `adb install -r`). Use it when the local toolchain is unavailable.
# The full `Android CI` gate still runs on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch o commit a compilar (default: main)"
        required: false
        default: "main"
        type: string

jobs:
  express:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAIINILLA_API_BASE_URL: ${{ vars.VAIINILLA_API_BASE_URL || 'https://vaiinillaback.up.railway.app/api/v1/' }}
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USER: ${{ secrets.GRADLE_REMOTE_CACHE_USER }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Dev debug APKs (express)
        run: ./gradlew --no-daemon assembleDevAlumnoDebug assembleDevCajaDebug assembleDevCocinaDebug

      - name: Upload Dev Debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vaiinilla-dev-debug-apks-express
          path: |
            app/build/outputs/apk/devAlumno/debug/*.apk
            app/build/outputs/apk/devCaja/debug/*.apk
            app/build/outputs/apk/devCocina/debug/*.apk
          if-no-files-found: error


