name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VAIINILLA_API_BASE_URL: ${{ vars.VAIINILLA_API_BASE_URL || 'https://vaiinillaback.up.railway.app/api/v1/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Validate contractual fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Audit release scope
        run: ./scripts/audit_release_scope.sh

      - name: App/backend regression gate
        run: ./scripts/check_app_backend_contract.sh

      - name: Unit tests (Dev & Prod)
        run: ./gradlew --no-daemon testDevDebugUnitTest testProdDebugUnitTest

      - name: Android lint (Prod)
        run: ./gradlew --no-daemon lintProdDebug

      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Build Dev & Prod debug APKs
        run: ./gradlew --no-daemon assembleDevDebug assembleProdDebug

      - name: Upload Dev Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaiinilla-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error

      - name: Upload Prod Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaiinilla-prod-debug-apk
          path: app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
