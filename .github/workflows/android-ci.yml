name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VAIINILLA_API_BASE_URL: ${{ vars.VAIINILLA_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Validate contractual fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Audit release scope
        run: ./scripts/audit_release_scope.sh

      - name: App/backend regression gate
        run: ./scripts/check_app_backend_contract.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vaiinilla-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
