name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pull-request checks must use the current Development API explicitly;
      # this prevents a stale repository variable from routing CI to a retired
      # Railway hostname. Main still uses the configured production endpoint.
      VAIINILLA_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://vaiinillaback-development.up.railway.app/api/v1/' || vars.VAIINILLA_API_BASE_URL || 'https://vaiinillaback.up.railway.app/api/v1/' }}
      # Shared remote build cache (build-cache-node on VPS behind Caddy TLS).
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USER: ${{ secrets.GRADLE_REMOTE_CACHE_USER }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Validate contractual fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Audit release scope
        run: ./scripts/audit_release_scope.sh

      - name: App/backend regression gate
        run: ./scripts/check_app_backend_contract.sh

      - name: Unit tests (Dev & Prod)
        run: ./gradlew --no-daemon testDevAlumnoDebugUnitTest testProdAlumnoDebugUnitTest

      - name: Android lint (Prod)
        run: ./gradlew --no-daemon lintProdAlumnoDebug

      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck


