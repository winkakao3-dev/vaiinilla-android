name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Validate contractual fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Audit VAI-10 scope
        run: ./scripts/audit_scope.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vaiinilla-vai10-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
