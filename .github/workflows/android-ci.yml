name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pull-request checks must use the current Development API explicitly;
      # this prevents a stale repository variable from routing CI to a retired
      # Railway hostname. Main still uses the configured production endpoint.
      VAIINILLA_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://vaiinillaback-development.up.railway.app/api/v1/' || vars.VAIINILLA_API_BASE_URL || 'https://vaiinillaback.up.railway.app/api/v1/' }}
      # Shared remote build cache (build-cache-node on VPS behind Caddy TLS).
      GRADLE_REMOTE_CACHE_URL: ${{ vars.GRADLE_REMOTE_CACHE_URL }}
      GRADLE_REMOTE_CACHE_USER: ${{ secrets.GRADLE_REMOTE_CACHE_USER }}
      GRADLE_REMOTE_CACHE_PASSWORD: ${{ secrets.GRADLE_REMOTE_CACHE_PASSWORD }}
      GRADLE_REMOTE_CACHE_PUSH: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # El runner tiene 16 GB: los 3 GB del proyecto (pensados para las Mac) ya no alcanzan para compilar
      # dos sabores en paralelo y Kotlin se quedaba sin memoria. ~/.gradle/gradle.properties manda sobre el
      # del proyecto solo aquí.
      - name: Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC"
          } >> ~/.gradle/gradle.properties

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*.py

      - name: Validate contractual fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Guardias de clases de error
        run: python3 scripts/guardias_clases_error.py

      - name: Guardias ampliadas (contrato app↔backend, controles muertos, cambio de tienda)
        run: |
          python3 scripts/contrato_app_backend.py
          python3 scripts/guardias_controles_muertos.py
          python3 scripts/guardias_cambio_de_tienda.py

      - name: Audit release scope
        run: ./scripts/audit_release_scope.sh

      - name: App/backend regression gate
        run: ./scripts/check_app_backend_contract.sh

      - name: Unit tests (Dev & Prod)
        run: ./gradlew --no-daemon testDevAlumnoDebugUnitTest testProdAlumnoDebugUnitTest

      - name: Android lint (Prod)
        run: ./gradlew --no-daemon lintProdAlumnoDebug

      # ktlint tiene avisos viejos: se bloquea solo lo nuevo (config/ktlint/ratchet.json).
      - name: ktlint (solo avisos nuevos)
        run: |
          ./gradlew --no-daemon ktlintCheck -PktlintRatchet
          python3 scripts/ktlint_ratchet.py

      - name: Subir reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-verify
          path: |
            app/build/reports/tests
            app/build/reports/ktlint
          retention-days: 7

  # Pruebas que ya estaban rojas (app/quarantine-tests.txt). No bloquean; avisan cuando una vuelve a pasar.
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      VAIINILLA_API_BASE_URL: https://vaiinillaback-development.up.railway.app/api/v1/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - name: Pruebas en cuarentena
        run: ./gradlew --no-daemon testDevAlumnoDebugUnitTest -PquarantineOnly

  # Compara las capturas de Roborazzi con sus referencias. Las referencias se grabaron en Mac y aquí se
  # renderiza en Linux: hasta que una corrida salga verde en el runner, el job no bloquea (continue-on-error).
  # Cuando salga verde dos veces seguidas, quitar continue-on-error para que bloquee.
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      VAIINILLA_API_BASE_URL: https://vaiinillaback-development.up.railway.app/api/v1/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew scripts/*.sh scripts/*.py
      - name: Comparar capturas
        run: scripts/screenshots.sh verify
      - name: Subir diferencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-diferencias
          path: app/build/outputs/roborazzi
          retention-days: 7


